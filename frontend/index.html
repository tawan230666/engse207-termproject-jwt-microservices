<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Task Board</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app">
        <div id="login-section" class="card">
            <h2>🔐 เข้าสู่ระบบ</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="alice@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="password123">
            </div>
            <button onclick="login()" class="btn-primary">Login</button>
            <p id="login-error" class="error-msg"></p>
        </div>

        <div id="task-section" class="card" style="display: none;">
            <div class="header">
                <h2>📋 My Tasks</h2>
                <div class="user-info">
                    👤 <span id="user-email"></span>
                    <button onclick="logout()" class="btn-secondary">Logout</button>
                </div>
            </div>
            
            <div class="add-task">
                <input type="text" id="new-task-title" placeholder="พิมพ์งานที่ต้องทำ...">
                <button onclick="createTask()" class="btn-success">+ เพิ่มงาน</button>
            </div>
            
            <ul id="task-list"></ul>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
